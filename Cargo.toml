[package]
name = "linuxfile"
version = "0.1.0"
edition = "2024"
description = "A Linux filesystem with std::fs semantics, stored in a single growable file"
license = "MIT OR Apache-2.0"
keywords = ["filesystem", "linux", "vfs", "container"]
categories = ["filesystem"]

[lib]
name = "linuxfile"
path = "src/lib.rs"

[dependencies]
lz4_flex = "0.14"

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
